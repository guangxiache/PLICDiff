model:
  checkpoint: ./checkpoint/9430000.pt

sample:
  seed: 2025
  num_samples: 200
  num_steps: 1000
  pos_only: False
  center_pos_mode: protein
  sample_num_atoms: prior
  # Null-origin CFG: f_null + g * (f_cond - f_null).
  # For conditional-origin coefficients omega, use g = 1 + omega.
  guidance_scale_pos: 3.0
  guidance_scale_v: 3.0
  # Include reference geometry in both branches with --reference_ligand --raw_ligand_path.
  guidance_use_reference_ligand: false
